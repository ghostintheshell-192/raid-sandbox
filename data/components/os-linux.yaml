id: os-linux
name: OS — Linux
category: os
pathSlot: os

description: >
  Linux operating system managing the RAID array in software. Uses mdadm (for
  traditional RAID 0/1/5/6/10) or ZFS (with integrated volume management and
  checksums). The CPU computes all parity; no dedicated hardware required.

provides:
  - raid-engine          # the RAID engine is the OS kernel (md driver or ZFS)
  - software-raid
  - os                   # the end of the control path (index.yaml `roles.sink`)

requires:
  - hba                  # needs individual disks visible (not a Virtual Drive)

tools:
  - mdadm                # classical Linux MD RAID
  - zfs                  # ZFS with native RAID-Z
  - lvm                  # LVM with striping/mirroring

note: >
  Without a battery-backed write cache (BBU) or UPS, a power loss during a write
  can leave the array in an inconsistent state. This is a soft constraint surfaced
  as a warning in the game.

# The verdict when NO engine object sits on the path and the disks reach this
# OS: the OS itself is the engine (`provides: raid-engine`).
verdict:
  raidType: software
  reason: >-
    No RAID engine sits on the path — Linux and the CPU compute the layout
    themselves, with no RAID hardware involved.

ui:
  label: "Linux"
  chip: "OS Linux"
  icon: "🐧"
  color: "rgba(46,204,113,.7)"

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: cpu
