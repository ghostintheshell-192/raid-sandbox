id: hba
name: HBA (Host Bus Adapter)
category: controller
pathSlot: controller

description: >
  Translates SATA/SAS electrical protocol and passes raw disk commands unchanged
  to the CPU over PCIe. The OS sees individual physical disks — it is responsible
  for any RAID processing.

provides:
  - protocol-translation
  - pcie-connection

requires:
  - pcie-slot

constraints:
  - rule: not-raid-capable
    message: >
      An HBA alone cannot host the RAID engine. With an HBA, RAID must be handled
      either by the OS (software RAID) or by a separate metadata-only chip near the CPU.

ui:
  label: "HBA"
  icon: "🔌"
  color: "rgba(149,165,166,.7)"

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: routing
  - id: out
    dir: out
    type: pcie
