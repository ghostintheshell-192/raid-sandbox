id: os-windows
name: OS — Windows
category: os
pathSlot: os

description: >
  Windows operating system managing RAID in software via Storage Spaces
  (Windows 8+/Server 2012+) or legacy Disk Management (dynamic volumes).
  Storage Spaces supports mirroring, striping, and parity spaces with
  optional journaling for crash consistency.

provides:
  - raid-engine
  - software-raid
  - os                   # the end of the control path (index.yaml `roles.sink`)

requires:
  - hba

tools:
  - storage-spaces       # modern Windows software RAID (ReFS or NTFS)
  - dynamic-volumes      # legacy: spanned/striped/mirrored/RAID-5 volumes

# The verdict when NO engine object sits on the path and the disks reach this
# OS: the OS itself is the engine (`provides: raid-engine`).
verdict:
  raidType: software
  reason: >-
    No RAID engine sits on the path — Windows and the CPU compute the layout
    themselves, with no RAID hardware involved.

# See os-linux.yaml for what this block is and which kernel source it answers
# to. Deliberately silent about what Windows itself offers: the ground truth
# available here is the Linux md source, and Storage Spaces' own crash-consistency
# machinery is not something this project has checked. What IS true of any path
# without protected cache is said, and nothing more.
writeHole:
  reason: >-
    Parity is computed on the CPU and written as a separate step, so a power cut
    between the two can leave a stripe whose parity no longer matches its data —
    and a later rebuild recomputes a missing disk from it without noticing.
    Nothing on a {raidType} path holds the write until both halves are safe; a
    UPS, or a controller with a battery-backed write cache, is what closes the
    gap.

ui:
  label: "Windows"
  chip: "OS Windows"
  icon: "🪟"
  color: "rgba(46,204,113,.7)"

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: cpu
