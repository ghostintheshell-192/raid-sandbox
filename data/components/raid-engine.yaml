id: raid-engine
name: RAID Engine
category: engine
pathSlot: engine

description: >
  A generic RAID engine node that can be placed at any point on the control path.
  Its position determines the RAID type: before the PCIe bus = Hardware RAID (on-controller);
  between PCIe bus and CPU = Fake RAID (near-CPU chip); after CPU, in the OS = Software RAID.

  This is the "motore RAID" from the RIEPILOGO diagram. The player places it; the recognizer
  reads its position and derives hardware / fake / software.

provides:
  - raid-engine

requires: []   # 'any' — connects anywhere in the chain; position determines the derived type

# 'any' port types: the engine connects anywhere in the path.
# Position determines the derived RAID type — validated by canvas-state._recognizePhysicalLayer().
raidEnginePosition: position-derived   # actual type determined at runtime by graph position

ui:
  icon: "⚙"
  color: "rgba(231,76,60,.7)"
  badge: "Engine"
  ports:
    - id: in
      dir: in
      type: any
    - id: out
      dir: out
      type: any
