id: pcie
name: PCIe Bus
category: connectivity
pathSlot: pcie

description: >
  PCI Express bus — the high-speed serial interface that connects storage controllers
  (HBAs, RAID controllers) to the CPU/chipset. All data between the controller and the
  CPU flows over this bus.

  It carries no weight in deriving the RAID type: hardware and fake RAID sit in the
  same wiring position (see ADR-001) and are told apart by which engine object is on
  the path — a RAID-on-Chip processor versus a metadata-only chip — not by where the
  bus sits relative to either.

provides:
  - pcie-connection

requires:
  - controller-or-hba on one side
  - cpu on the other side

note: >
  NVMe disks bypass the backplane and HBA entirely, connecting directly to the PCIe bus.
  This is why NVMe disks can reach PCIe without going through an HBA node.

ui:
  label: "PCIe bus"
  icon: "🔷"
  color: "rgba(241,196,15,.5)"

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: pcie
    accepts: [NVMe]
  - id: out
    dir: out
    type: pcie
