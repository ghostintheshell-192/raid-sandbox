id: engine-roc
name: RAID Engine (RoC)
category: engine
pathSlot: engine

description: >
  A dedicated PCIe card that includes BOTH the HBA (protocol translation) AND a
  RAID-on-Chip (RoC) processor. The RoC computes parity, manages the stripe, and
  exposes one or more Virtual Drives to the OS — the OS never sees the individual
  physical disks.

  Examples: Broadcom MegaRAID, Adaptec SmartRAID.

provides:
  - protocol-translation
  - raid-engine
  - virtual-drive        # the OS sees this, not the physical disks
  # The write cache this object is modelled with is battery- or flash-backed: an
  # interrupted stripe write is replayed when power returns, which is what closes
  # the write hole (§6 `write-hole`, soft). This is the game's model of a RoC —
  # the protected cache is part of what makes it one (ADR-001) — not a promise
  # that every real controller ships with the battery module fitted. Claiming
  # this capability is what keeps the rule silent on this path; an engine that
  # does NOT claim it explains itself in its own `writeHole.reason`.
  - power-loss-protection

requires:
  - pcie-slot

note: >
  Because the OS sees only the Virtual Drive, software-level RAID tools (mdadm, ZFS)
  cannot manage the individual disks — they are hidden by the controller firmware.

# The verdict this object yields when it sits on the disks → OS path (ADR-001:
# the object's identity decides, and the object declares it here — the engine
# reads this block, it does not know this component by name).
verdict:
  raidType: hardware
  reason: >-
    The RAID engine is a RAID-on-Chip — it sits before the PCIe bus, builds the
    array itself, and the OS sees one virtual drive.

ui:
  label: "RAID Engine"
  icon: "🖥"
  color: "rgba(52,152,219,.7)"
  badge: "RoC"
  tooltip: "Dedicated compute silicon — has its own processor and XOR/Galois accelerator, computes the array itself."

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: routing
  - id: out
    dir: out
    type: virtual-drive
