id: cpu
name: CPU
category: compute
pathSlot: cpu

description: >
  The central processing unit. Receives commands from the storage controller via the PCIe bus
  and executes OS-level instructions. In software RAID, the CPU computes all parity and
  manages the RAID array directly (via mdadm, ZFS, Storage Spaces). In hardware RAID,
  the CPU only sees the Virtual Drive exposed by the controller — the RAID processing is
  transparent.

provides:
  - cpu-execution

requires:
  - pcie-connection

ui:
  icon: "⚡"
  color: "rgba(241,196,15,.7)"
  ports:
    - id: in
      dir: in
      type: pcie
    - id: out
      dir: out
      type: cpu
