id: engine-metadata
name: RAID Engine (metadata)
category: engine
pathSlot: engine

description: >
  A dedicated chip placed between the HBA and the CPU (on the motherboard or near
  it) that owns the RAID metadata and boot firmware — no compute silicon of its
  own. The OS still sees individual disks (unlike hardware RAID) but uses a driver
  to participate in RAID operations; the actual parity computation runs on the CPU.

  The canonical example is Intel RST (Rapid Storage Technology) on Intel chipsets.
  Also known as "motherboard RAID", "BIOS RAID", or, once its wiring reveals what
  it is, "fake RAID".

provides:
  - raid-engine          # the RAID engine sits here, between HBA and OS

requires:
  - hba                  # needs a dumb HBA to pass raw disk signals through PCIe
  - os-driver            # requires a matching OS driver (RST driver for Windows, etc.)

note: >
  This is a hybrid: the chip owns the metadata and speeds up some operations, but
  the actual parity computation still involves the CPU. Without the OS driver the
  array cannot be accessed — unlike hardware RAID which is driver-independent.

# The verdict this object yields when it sits on the disks → OS path (ADR-001).
verdict:
  raidType: fake
  reason: >-
    The RAID engine is a metadata-only chip — it owns the array metadata, but
    the CPU still computes the parity, not the chip.

# See os-linux.yaml for what this block is and which kernel source it answers to.
# This chip is the case that makes the distinction worth teaching: it sits in the
# same slot as a RAID-on-Chip and looks like RAID hardware, but there is no cache
# here to protect, so a parity array on it is exposed exactly as software RAID is.
writeHole:
  reason: >-
    The parity for each stripe is computed on the CPU and written after the data,
    so a power cut between the two can leave a stripe whose parity no longer
    matches, and a later rebuild trusts it. This chip owns the array metadata but
    has no write cache of its own to protect, so on {raidType} RAID nothing here
    holds the write — that job falls to a UPS.

ui:
  label: "RAID Engine"
  icon: "🔲"
  color: "rgba(231,76,60,.4)"
  badge: "metadata"
  tooltip: "Metadata and boot firmware only, no compute silicon — a general-purpose CPU does the actual math."

# Ports are model, not UI: the engine reads them to validate every connection
# and to route disks (`accepts`). The port-type relation is in index.yaml.
ports:
  - id: in
    dir: in
    type: pcie
  - id: out
    dir: out
    type: pcie
