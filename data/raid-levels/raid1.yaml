id: raid1
name: RAID 1
notRaid: false
reason: "mirroring, {n} copies"   # the recognizer's one-line "why"; {n} = member count

# Topology shape (matches the recognizer §4 rule)
shape:
  segmentation: linear
  redundancy: mirror
  members: disks

minDisks: 2

# Nothing runs below 2 (specs/planned/degenerate-levels.md §5): the bound is structural.
minDisksToRun: 2
minDisksToRunSource: "structural — an array of one member is that member; the sandbox refuses it before any level is named (spec §6, the universal ≥ 2)"

# A mirror whose members are mirrors is one mirror: this is what lets a RAID 51 whose
# spans collapsed into pairs read as a four-way RAID 1 (degenerate-levels §3, §4).
absorbsNested:
  because: "a mirror of mirrors is one mirror — every disk still holds a full copy"
  source: "content algebra (degenerate-levels §6): every cell of every member carries the same segment, so the copy count is the disk count"

# Reference only — documentation, not data (see tech-debt/level-numbers-duplicated-untested.md).
# faultToleranceAtMinimum is the level's tolerance AT ITS MINIMUM DISK COUNT, not the
# array's — RAID 1 is exactly where this bites: an n-way mirror with n > 2 survives
# n-1 failures, not 1. The engine derives the real number from the tree. Checked
# against the engine (at minDisks) by raid-levels-data.test.js.
reference:
  faultToleranceAtMinimum: 1
  capacityFormula: "disk size (one copy's worth, regardless of disk count)"

defaultAlgorithm: null

# Shown in the algorithm slot when it is disabled (canvas-controller.js
# `_makeSlots`) — the fact the slot states instead of just disappearing.
# This is the sentence for the CLASS this shape belongs to (linear+mirror),
# reused by every node of that class regardless of what its members are —
# including a RAID 51's outer mirror-of-spans, which is linear+mirror at
# that node too. Written for "member", not "disk", so it stays true there.
# See tech-debt/algorithm-slot-vanishes-silently.md.
noAlgorithmReason: "a plain mirror has no layout to choose — every member holds a full copy"

description: >
  Every disk is an exact, real-time copy of every other disk. If one fails,
  the others keep everything running as if nothing happened.

pros:
  - Simplest form of redundancy
  - Reads can be served from any member (potential read speedup)
  - Survives N−1 disk failures (n-way mirror)

cons:
  - 1/N usable capacity (50% for 2 disks)
  - Writes go to every disk simultaneously — write throughput limited by slowest disk

useCases:
  - Operating system drives
  - Small databases needing high availability
  - Any data too critical to lose

notFor:
  - Large storage pools (high capacity overhead)
  - High-throughput write workloads
