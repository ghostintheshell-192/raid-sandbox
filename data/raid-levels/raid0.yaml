id: raid0
name: RAID 0
notRaid: false
reason: "striping, no redundancy"   # the recognizer's one-line "why"

# Topology shape (matches the recognizer §4 rule)
shape:
  segmentation: striped
  redundancy: none
  members: disks

minDisks: 2

# Reference only — documentation, not data (see tech-debt/level-numbers-duplicated-untested.md).
# faultToleranceAtMinimum is the level's tolerance AT ITS MINIMUM DISK COUNT, not the
# array's; the engine derives the real numbers. Checked against the engine by
# raid-levels-data.test.js.
reference:
  faultToleranceAtMinimum: 0
  capacityFormula: "N × disk size"

defaultAlgorithm: null

# Shown in the algorithm slot when it is disabled (canvas-controller.js
# `_makeSlots`) — the fact the slot states instead of just disappearing.
# This is the sentence for the CLASS this shape belongs to (striped+none),
# reused by every node of that class regardless of what its members are —
# including a RAID 50's outer stripe-of-spans, which is striped+none at
# that node too. Written for "stripe", not "RAID 0", so it stays true there.
# See tech-debt/algorithm-slot-vanishes-silently.md.
noAlgorithmReason: "a plain stripe has no parity and no copies to place"

description: >
  Data is split into blocks (stripes) and distributed across all disks in round-robin
  order. Every disk holds a piece of every file. Pure speed — zero redundancy.

pros:
  - Maximum read and write throughput (all disks active in parallel)
  - Full utilization: no disk space lost to parity or mirroring

cons:
  - Zero fault tolerance: one disk failure destroys all data
  - The more disks, the higher the probability of a failure

useCases:
  - Video editing scratch disks
  - Temporary rendering caches
  - Test environments where data loss is acceptable

notFor:
  - Anything you cannot afford to lose
  - Production databases
  - Long-term storage
