id: jbod
name: JBOD / spanned
notRaid: true
reason: "concatenation of disks (no RAID)"   # the recognizer's one-line "why"

# Topology shape (matches the recognizer §4 rule)
shape:
  segmentation: linear
  redundancy: none
  members: disks

minDisks: 2

# Nothing runs below 2 (specs/planned/degenerate-levels.md §5): the bound is structural.
minDisksToRun: 2
minDisksToRunSource: "structural — an array of one member is that member; the sandbox refuses it before any level is named (spec §6, the universal ≥ 2)"

# Reference only — documentation, not data the engine reads. faultToleranceAtMinimum
# is the level's guaranteed tolerance AT ITS MINIMUM DISK COUNT, not the array's (see
# tech-debt/level-numbers-duplicated-untested.md); the engine derives the real numbers
# from the tree and that is what the game shows. Checked against the engine by
# raid-levels-data.test.js.
reference:
  faultToleranceAtMinimum: 0
  capacityFormula: "sum of all disk sizes"

defaultAlgorithm: null

# Shown in the algorithm slot when it is disabled (canvas-controller.js
# `_makeSlots`) — the fact the slot states instead of just disappearing.
# This is the sentence for the CLASS this shape belongs to (linear+none),
# reused by every node of that class regardless of what its members are —
# no nested level currently reaches this class, but the wording still
# names "members", not "disks", on the same principle as raid0/raid1.
# See tech-debt/algorithm-slot-vanishes-silently.md.
noAlgorithmReason: "a concatenation places nothing — members are joined end to end"

description: >
  Just a Bunch Of Disks — concatenation with no striping and no redundancy.
  Disks are addressed sequentially: the first disk fills up, then the second,
  and so on. No performance gain, no fault tolerance.

useCases:
  - Combining disks of different sizes into one logical volume
  - Extending a volume when budget does not allow redundancy

notFor:
  - Any data you cannot afford to lose
  - Performance-sensitive workloads
