id: raid0plus1
name: RAID 0+1
notRaid: false
reason: "mirror over RAID-0 spans (0+1)"   # the recognizer's one-line "why"

# Topology shape (matched by the recognizer, spec §4): a mirror of two or more
# RAID-0 legs. The inverse nesting of RAID 1+0 — and the weaker one: a single
# disk failure takes a whole leg down, so the mirror is left with one copy.
shape:
  segmentation: linear
  redundancy: mirror
  members: arrays
  childShape:
    segmentation: striped
    redundancy: none
    members: disks

minDisks: 4   # 2 mirrored legs × 2-disk RAID 0

# Reference only — documentation, not data (see tech-debt/level-numbers-duplicated-untested.md).
# faultToleranceAtMinimum is the level's tolerance AT ITS MINIMUM DISK COUNT, not the
# array's (guaranteed: one failure kills a leg, the other leg survives). The engine
# derives the real number from the tree. Checked against the engine by
# raid-levels-data.test.js.
reference:
  faultToleranceAtMinimum: 1
  capacityFormula: "one RAID-0 leg  =  N/2 × disk size (for uniform legs)"

defaultAlgorithm: null

description: >
  Two or more RAID 0 stripes mirrored onto each other. Same capacity and same
  guaranteed fault tolerance as RAID 1+0, but a worse failure profile: one disk
  loss disables its entire stripe, so a second loss on the OTHER leg is fatal,
  whereas RAID 1+0 survives any second failure outside the affected pair.

pros:
  - Read throughput of a stripe, protection of a mirror
  - Simple to reason about (two identical legs)

cons:
  - A single disk failure degrades a whole leg; rebuild re-copies the entire stripe
  - Strictly worse than RAID 1+0 at the same cost — recognized so the sandbox can say so

useCases:
  - Legacy controllers that mirror volumes rather than disks

note: >
  Recognized separately from RAID 1+0 because the two are often conflated and the
  difference (what a single failure takes down) is exactly what the sandbox teaches.

# Soft §6 advisory (validator.js `level-advisory`, generic — the rule only asks
# whether the recognized level has one). `{label}` is filled in by the validator
# with the array's structural label ("This array", "Span 1", …).
advisory: >-
  {label} is a RAID 0+1: a mirror of stripes. It guarantees one failure, like RAID 1+0,
  but a failed disk takes its whole striped leg with it, so a second failure is fatal
  in 2 cases out of 3 — RAID 1+0 survives it in 2 cases out of 3. Same disks, same
  capacity, weaker array: nest the other way round.
