  - "David A. Patterson, Garth Gibson, Randy H. Katz — A Case for Redundant Arrays of Inexpensive Disks (RAID). SIGMOD 1988"
  - "md(4) man page — RAID0: chunks assigned to devices in turn; mdadm(8): the chunk size as the striping parameter"
  - "src/engine/model.js readWidth() vs readParallelism() — the two kinds of speed, as the sandbox derives them: one request's width, and the disks serving parallel readers"

