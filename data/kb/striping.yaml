# data/kb/striping.yaml — striping as a technique: what it buys, what it costs, and
# why it is older than RAID. The mechanics of the split (chunk, stripe, the address
# arithmetic) are in segmentation.yaml; this entry does not repeat them.
# Writing rules: see segmentation.yaml header.

id: striping
kind: concept
name: Striping
short: >
  Cutting data into fixed-size chunks and dealing them out across several disks in
  turn, so that one large request is served by all of them at once and many small
  requests are served by different disks at the same time. It multiplies speed by
  the number of disks and multiplies the chance of losing everything by the same
  number.

long: |
  Striping is one of the two answers to [[segmentation]], and the one every RAID
  level except RAID 1 and JBOD is built on. That page shows the mechanics: the
  [[chunk]], the stripe, the arithmetic that sends a sector to a disk. This one is
  about what the technique does.

  ## Two kinds of speed

  A disk answers one request at a time, at its own bandwidth. Put *N* disks side by
  side and deal the data across them, and two different things get faster.

  **One large request.** A read of many chunks touches many disks, and the
  [[raid-engine]] issues the pieces to all of them together. The request finishes
  when the slowest piece finishes, so the array's bandwidth for it approaches *N*
  times one disk's. This is the sequential case: video, backups, large files.

  **Many small requests.** A request smaller than a chunk touches one disk. Striping
  does not make it faster; but the next small request, at an unrelated address,
  most likely lands on a different disk, and the two are served at the same time.
  The array does not answer one request faster; it answers *N* at once. This is the
  random case: databases, many users, small files.

  The two are worth telling apart because they are bought differently. Bandwidth
  for one request comes from the *width* of the stripe, the number of disks a
  request spans, and a larger chunk narrows it. Throughput for many requests comes
  from the *number* of disks and from requests being spread across them, which a
  larger chunk helps. The chunk size is the knob between the two, and the [[chunk]]
  entry says what the defaults are and why.

  ## The price

  Every disk holds a piece of everything. A file of any size beyond one chunk is
  spread over several disks, and the address space as a whole is spread over all
  of them. If one disk fails, what remains is not "the other files": it is every
  file with holes in it. A striped set of *N* disks with no redundancy fails when
  *any* of its disks fails, so it fails, on average, *N* times as often as one disk.

  This was known before RAID had a name. Salem and Garcia-Molina described disk
  striping in 1986 as a way to get bandwidth from several disks, and in 1988 the
  same authors published on its impact on reliability. The paper that named RAID,
  by Patterson, Gibson and Katz in the same year, starts from that cost: an array
  of many cheap disks is fast and fails often, and the levels it defines are the
  ways to pay for the reliability back. That is why striping and [[redundancy]] are
  two separate axes: striping is the speed, redundancy is what is added so that
  the speed does not come with the *N*-fold failure rate.

  ## Striping under redundancy

  With a [[mirroring]] layer the striped set is copied, or the stripe is built out
  of copies (RAID 10). With [[parity]] the stripe is the unit the parity is computed
  over: one chunk per stripe holds the XOR of the others, and the stripe is what a
  full-stripe write can compute in one go and what a small write has to read back
  to update. Parity does not exist without a stripe, which is why there is no
  linear level with parity.

related: [segmentation, chunk, redundancy, mirroring, parity, performance, raid-engine]

