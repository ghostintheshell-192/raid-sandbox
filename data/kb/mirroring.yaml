sources:
  - ref: "md(4) man page"
    note: "RAID1: 'each device in a RAID1 array contains exactly the same data. Changes are written to all devices in parallel. Data is read from any one device. The driver attempts to distribute read requests across all devices to maximise performance'; RAID10: 'every datablock is duplicated some number of times, and the resulting collection of datablocks are distributed over multiple drives'; near / far / offset layouts; 'there must be at least as many devices as replicas'; far layout: 'similar to RAID0 in terms of speed', 'more seeking for writes'"
    url: https://man7.org/linux/man-pages/man4/md.4.html
  - ref: "drivers/md/raid1.c read_balance()"
    note: "the criteria that choose the copy serving a read (sequential continuation, pending load, head distance); raid1_write_request() — the write issued to every non-faulty mirror"
    url: https://github.com/torvalds/linux/blob/master/drivers/md/raid1.c
  - ref: "drivers/md/raid10.c"
    note: "header comment: 'Each device is divided into far_copies sections. In each section, chunks are laid out in a style similar to raid0, but near_copies copies of each chunk is stored (each on a different drive)'"
    url: https://github.com/torvalds/linux/blob/master/drivers/md/raid10.c
  - ref: "Patterson, Gibson, Katz — A Case for RAID, 1988"
    note: "§7 First Level RAID: Mirrored Disks — 'all disks are duplicated (G=1 and C=1), and every write to a data disk is also a write to a check disk'; useable storage capacity 50%"
    url: https://www.cs.cmu.edu/~garth/RAIDpaper/Patterson88.pdf
  - ref: "Microsoft Learn, Storage Spaces overview"
    note: "'Two-way mirroring tolerates one drive failure; three-way mirroring tolerates two simultaneous drive failures'"
    url: https://learn.microsoft.com/en-us/windows-server/storage/storage-spaces/overview
  - ref: "src/engine/model.js capacityGB() / failuresToKill()"
    note: "the RAID 1 rule (one copy's worth, kill every member) and the flat RAID 10 rule (sum ÷ copies, kill all copies of a chunk)"
    url: ../src/engine/model.js

