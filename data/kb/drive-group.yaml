  - "Broadcom, 12Gb/s MegaRAID Tri-Mode Software User Guide, Drive Group — 'A drive group is a group of physical drives. These drives are managed in partitions that are known as virtual drives'"
  - "Broadcom, same guide, RAID 10 Drive Groups — 'Configure RAID 10 by spanning two or more contiguous RAID 1 virtual drives'"
  - "Microsoft Learn, Storage Spaces overview — 'aggregate multiple physical drives into a single logical storage pool, from which you can create virtual disks known as Storage Spaces'"

