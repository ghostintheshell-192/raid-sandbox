  - "md(4) man page — RAID0: 'configured at creation with a Chunk Size which must be at least 4 kibibytes'; chunks assigned to devices in turn"
  - "Broadcom, 12Gb/s MegaRAID Tri-Mode Software User Guide, Disk Striping — strip size, stripe size and stripe width, quoted; strips 'from a minimum of 64 KB to 1 MB'"
