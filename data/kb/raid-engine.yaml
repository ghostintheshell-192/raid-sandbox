    note: "a JBOD drive 'is exposed to the host operating system as a stand-alone drive'; JBOD drives cannot join a RAID configuration 'because they do not have valid DDF records'"
    url: https://techdocs.broadcom.com/us/en/storage-and-ethernet-connectivity/enterprise-storage-solutions/12gbs-megaraid-tri-mode-software/1-0/v11668655/v11672350/v11672410/v11672482.html
