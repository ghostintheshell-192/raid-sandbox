  - ref: "Broadcom, MegaRAID 9500 PCIe Gen 4.0 Tri-Mode Storage Adapters product brief"
    note: "'Based on the Broadcom SAS3916 and SAS3908 … RAID on Chip (RoC) controller'; cache size 8 GB on the 9560-16i, 4 GB on the 9560-8i"
