    url: https://www.cs.cmu.edu/~garth/RAIDpaper/Patterson88.pdf
  - text: "md(4) man page — RAID4: 'like a RAID0 array with an extra device for storing parity'; RAID5: 'the parity blocks for each stripe, instead of being on a single device, are distributed across all devices', 'allows more parallelism when writing'; RAID6: 'can handle the loss of any two devices without data loss'"
    url: https://man7.org/linux/man-pages/man4/md.4.html
  - text: "drivers/md/raid5.c raid5_compute_sector(), ALGORITHM_LEFT_SYMMETRIC: pd_idx = data_disks - sector_div(stripe2, raid_disks); *dd_idx = (pd_idx + 1 + *dd_idx) % raid_disks"
    url: https://github.com/torvalds/linux/blob/master/drivers/md/raid5.c
  - text: "drivers/md/raid5.c handle_stripe_dirtying() — rmw and rcw counted per stripe; 'prefer read-modify-write, but need to get some data'; the reconstruct-write branch taken when rcw is the cheaper"
    url: https://github.com/torvalds/linux/blob/master/drivers/md/raid5.c
  - text: "H. Peter Anvin — The mathematics of RAID-6 (2004, last updated 2011): 'RAID-6 supports losing any two drives. The way this is done is by computing two syndromes, generally referred P and Q'; P as XOR parity, Q as a Reed-Solomon code over GF(2⁸) with generator {02}; 255 data drives at most"
    url: https://www.kernel.org/pub/linux/kernel/people/hpa/raid6.pdf
  - text: "mke2fs(8) man page, -E stripe_width — 'allows the block allocator to prevent read-modify-write of the parity in a RAID stripe'"
    url: https://man7.org/linux/man-pages/man8/mke2fs.8.html
