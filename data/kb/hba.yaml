# data/kb/hba.yaml — a physical actor on the control path. Read against its
# sources on 2026-09-27 (the to-verify queue): an HBA can compute RAID without
# parity (IR firmware); a RAID controller is one chip, not an HBA plus an engine
# on the same board; current HBAs have x8 connectors; tri-mode adapters attach
# NVMe disks too. The ADR and the expander patent it cited are gone from the
# sources. Writing rules: see segmentation.yaml header.

id: hba
kind: concept
name: HBA
short: >
  The host bus adapter: the card, or the chipset function, that connects the disks
  (over SATA or SAS) to the CPU (over PCIe). It passes each disk through unchanged,
  so the operating system sees every one of them. A plain HBA computes no RAID;
  some run a firmware with the simple levels, never parity. A RAID controller is
  built on one chip that is both the disk controller and a RAID engine.

searchTitle: "What is an HBA? Host bus adapter vs RAID controller"
searchDescription: >
  An HBA connects SATA or SAS disks to PCIe and passes each one to the OS. HBAs with
  IR firmware do RAID 0, 1 and 10; parity needs a RAID controller's engine.

long: |
  ## Function

  Disks connect over [[sata|SATA]] or [[sas|SAS]]; the CPU reaches expansion cards
  over [[pcie|PCIe]]. Something on the path has to speak both, and that is the host
  bus adapter, which SNIA defines as "an I/O adapter that connects a host computer
  bus to an I/O interconnect".

  SAS carries SCSI commands, and SCSI names the two ends of a command. The
  *initiator* is "the endpoint that originates a SCSI I/O command sequence", the
  *target* is "the endpoint that receives" it. The HBA is the initiator ("I/O
  adapters … are typical initiators") and each disk a target. The HBA takes a read
  or write from the operating system, sends it to the right disk (through a
  [[backplane]] if there is one), and returns the answer.

  An HBA does not change what the operating system sees: every
  [[physical-disks|physical disk]] appears as itself. Microchip describes the HBA
  mode of its cards in these terms: "RAID functions of the controller are
  disabled. All attached drives are surfaced as RAW devices." Any RAID is then done
  by something else: the operating system, or a firmware working with the
  operating system's driver ([[raid-engine]]).

  ## Forms

  On a desktop the HBA is not a card: the chipset's SATA controller is one.
  Intel's AHCI specification, the standard those controllers follow, says so: "A
  host bus adapter refers to the silicon that implements the AHCI specification to
  communicate between system memory and Serial ATA devices."

  On a server the HBA is usually a PCIe card, and each of its connectors carries
  several [[lane|lanes]]. The LSI SAS 9300-8i has "two x4 internal mini-SAS HD
  connectors (SFF-8643)", four lanes each; the Broadcom 9500-16i has "Two x8
  SFF-8654", eight lanes each.

  ## HBAs with simple RAID

  Some HBAs do compute RAID, within a limit, when they are given a different
  [[firmware]]. The LSI SAS 9300-8i can be reflashed "to run Integrated RAID (IR)
  firmware", which supports "RAID 0, RAID 1, RAID 10, and RAID 1E". These are the
  levels without [[parity]]: they place and copy blocks but compute nothing from
  them. Parity needs a chip built for it.

  ## HBA and RAID controller

  The difference between an HBA and a RAID controller is the difference between
  software and hardware RAID. A RAID controller card is built on a *RAID-on-Chip*
  (RoC): one chip that is at once the disk controller and the RAID engine.
  Broadcom's SAS3916 is a "single-chip solution", listed for use in a
  "SAS/SATA/PCIe RAID host bus adapter", with "Hardware RAID Levels 5, 6". The
  engine builds the array and hands the operating system a [[virtual-drive]]
  instead of the disks.

  In one product family the two kinds are two different chips. Broadcom's
  9562-16i RAID adapter uses the SAS3916 RoC, with RAID levels "0, 00, 1, 10, 5,
  50, 6, 60"; its 9502-16i HBA uses the SAS3816, an I/O controller, and its RAID
  levels read "—". Linux has one driver for each: `mpt3sas` for "PCI-Express SAS
  12Gb/s Host Adapters", `megaraid_sas` for "SAS based RAID controllers".

  What a card is for the operating system depends on how it works, not on where it
  sits. Some cards can be switched between the two: Microchip's cards have an "HBA
  Mode" with the RAID functions disabled, and a "Mixed" mode that exposes RAID
  volumes and raw drives together.

  ## NVMe disks

  An [[nvme|NVMe]] disk carries its own controller on the PCIe bus. In the words of
  the NVMe specification, "when PCI Express is used as the transport, then a
  controller is a PCI Express function". Nothing has to translate between the disk
  and the CPU, so an NVMe disk can connect without an HBA. Tri-mode adapters can
  attach NVMe disks anyway, next to SAS and SATA ones in the same bays: Broadcom's
  "PCIe device bridge (PDB) enables the PCIe (NVMe) storage interface
  connections".

related: [backplane, physical-disks, raid-engine, virtual-drive, sata, sas, pcie, nvme]

