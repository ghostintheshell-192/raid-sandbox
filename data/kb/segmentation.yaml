sources:
  - "md(4) man page — LINEAR: 'simply catenates the available space on each drive to form one large virtual drive'; RAID0: 'assigns the first chunk of the array to the first device, the second chunk to the second device, and so on until all drives have been assigned one chunk'"
  - "mdadm(8) man page, --chunk: 'only meaningful for RAID0, RAID4, RAID5, RAID6, and RAID10'; 'The default when creating an array is 512KB'"
  - "drivers/md/raid0.c map_sector() — sector ÷ chunk_sects gives the chunk and the offset in it; the chunk modulo the devices in the zone gives the device; zones are how devices of unequal size are handled"
  - "drivers/md/md-linear.c linear_conf() / which_dev() — each device's end_sector is the previous one's plus its own size; a sector is served by the device whose range contains it"
  - "Microsoft Learn, Storage Spaces overview — simple spaces: 'Data is striped across multiple drives', 'no resiliency or redundancy'"
  - "src/engine/model.js writeParallelism() / readWidth() — striped → the stripe width, linear → 1: the rule the sandbox computes with"
  - "src/engine/layout.js placeStripe() / placeLinear() — the two grids the sandbox draws; and the refusal of linear + parity ('parity requires striping')"

