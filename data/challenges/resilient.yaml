id: resilient
title: Large Archive, High Risk
client: "Archivist, research institute"
prompt: >
  I'm building a long-term archive on six 4 TB disks. With this many drives, a
  second disk can fail during the hours-long rebuild after the first — so the
  array has to survive two simultaneous failures.
inventory:
  disks: [ { count: 6, sizeGB: 4, protocol: SATA } ]
requirements:
  - { metric: faultTolerance, op: '>=', value: 2 }
hint: You need two independent parity calculations per stripe.
successMessage: >
  Double parity (RAID 6) survives any two simultaneous failures and still leaves
  16 TB usable. RAID 60 would also clear the bar — the requirement is "survive
  two", and any topology that does so wins.
