id: mirror
title: Critical Data, Simple Setup
client: "Solo dev, single workstation"
prompt: >
  I have just two 2 TB disks and I need to keep my operating system running.
  A single disk failure must not cause any downtime.
requirements:
  diskCount:      { op: '==', value: 2 }
  rawCapacityGB:  { op: '==', value: 4 }    # 2 × 2 TB
  capacityGB:     any
  faultTolerance: { op: '>=', value: 1 }
  readClass:      any
  writeClass:     any
hint: With only two disks, you need a full copy of everything on both.
