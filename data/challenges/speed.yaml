id: speed
title: Maximum Speed
client: "VFX artist, render farm"
prompt: >
  I have three disks and I need the maximum possible read and write throughput
  for a temporary rendering cache. Data loss is acceptable — nothing here is permanent.
requirements:
  diskCount:      { op: '==', value: 3 }
  rawCapacityGB:  any
  capacityGB:     any
  faultTolerance: any
  readClass:      { op: in, value: [high] }
  writeClass:     { op: in, value: [high] }
hint: You need no redundancy here — put every disk to work for raw speed.
successMessage: >
  Striping all three disks with no redundancy (RAID 0) gives full read and write
  throughput. The cost — zero fault tolerance — is exactly the trade-off the brief accepts.
