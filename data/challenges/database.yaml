id: database
title: High-Traffic Database
client: "DBA, SaaS company"
prompt: >
  I'm hosting a busy database on four disks. I need top read AND write
  performance, and it must survive a disk failure. Cost is not a concern.
requirements:
  diskCount:      { op: '==', value: 4 }
  rawCapacityGB:  any
  capacityGB:     any
  faultTolerance: { op: '>=', value: 1 }
  readClass:      { op: in, value: [high] }
  writeClass:     { op: in, value: [high] }
hint: Combine two ideas — striping for speed, mirroring for the failure you must survive.
